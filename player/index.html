<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{--ink:#17212f;--glass:#ffffff;--panel:#f1f4f8;--hover:#e2e9f3;--line:#6b7b90;--trim:#f6c84a;--focus:#1d4ed8;--muted:#48586d;--surface:#ffffff;--error:#8f2020}body[data-theme=dark]{--ink:#edf2fa;--glass:#1b222e;--panel:#242f3e;--hover:#354358;--line:#8797ad;--focus:#9abfff;--muted:#becbde;--surface:#1b222e}*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--surface)}.stage{width:100%;min-width:0;position:relative;isolation:isolate;background:var(--panel);border-radius:14px;overflow:hidden;aspect-ratio:16/9;min-height:290px;max-height:540px}video{display:block;width:100%;height:100%;object-fit:contain}video::-webkit-media-controls{display:none!important}.overlay{position:absolute;bottom:0;left:0;right:0;padding:14px 18px;background:var(--panel)}.toolbar,.times{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{margin-bottom:10px}.times{margin-top:10px;justify-content:space-between}.group{display:flex;align-items:center;gap:8px}.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}.duration{margin-left:auto;font-size:13px;color:var(--ink)}button{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--glass);border-radius:8px;min-height:44px;min-width:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;transition:border-color .15s}button:hover{background:var(--hover)}button[aria-pressed=true]{border-color:var(--focus);color:var(--ink)}svg{width:20px;height:20px;fill:currentColor}input{font:inherit;font-variant-numeric:tabular-nums;background:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:6px;min-height:44px;width:98px;text-align:center}button:focus-visible,input:focus-visible,[role=slider]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.timeline{position:relative;height:54px;margin:0 12px;touch-action:none;border-radius:6px;background:#253144}canvas{width:100%;height:100%;display:block;border-radius:6px}.shade{position:absolute;top:0;bottom:0;background:#0009;pointer-events:none}.leftShade{left:0}.rightShade{right:0}.selection{position:absolute;top:0;height:100%;border-top:3px solid var(--trim);border-bottom:3px solid var(--trim);box-shadow:0 0 0 2px #080c12,inset 0 0 0 2px #080c12;pointer-events:none}.handle{position:absolute;top:-3px;bottom:-3px;width:28px;min-width:28px;min-height:60px;padding:0;border:0;border-radius:6px;background:var(--trim);box-shadow:0 0 0 2px #080c12;color:#211900;transform:translateX(-50%);z-index:3;cursor:ew-resize;touch-action:none}.handle:before{content:'';width:3px;height:22px;border-radius:2px;background:currentColor}.handle:hover{background:#ffe28a}.handle:after{content:'';position:absolute;inset:-2px -8px}.playhead{position:absolute;top:0;bottom:0;width:2px;background:white;box-shadow:0 0 0 1px #080c12;pointer-events:none;z-index:2}label{font-size:12px;color:var(--muted)}.help{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--panel);color:var(--muted);font-size:12px}.error{padding:8px;color:#fff;background:#8f2020;border-radius:8px}.error:empty{display:none}.loading{position:absolute;top:16px;left:16px;background:var(--glass);padding:6px 10px;border-radius:6px;font-size:13px}@media(max-width:480px){.overlay{padding:10px}.stage{min-height:330px}.times{gap:8px}.toolbar{gap:6px}.duration{font-size:12px}.clock{font-size:12px}.times .group{gap:4px}.times input{width:85px}button{padding:6px 8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="stage" id="stage" tabindex="0" aria-label="Редактор видео. Пробел — воспроизведение или пауза">
<video id="video" crossorigin="anonymous" preload="metadata" playsinline></video><span class="loading" id="loading" role="status">Загрузка видео…</span>
<div class="overlay">
<div class="toolbar"><button id="play" aria-label="Воспроизвести выбранный фрагмент"><svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><span class="clock" id="clock">00:00 / 00:00</span><button id="whole" aria-pressed="false" title="Смотреть полное видео без ограничения границ">Весь файл</button><span id="duration" class="duration"></span></div>
<div class="timeline" id="timeline" aria-label="Шкала полного видео"><canvas id="film"></canvas><div class="shade leftShade" id="leftShade"></div><div class="shade rightShade" id="rightShade"></div><div class="selection" id="selection"></div><div class="playhead" id="playhead"></div><button class="handle" id="startHandle" role="slider" aria-label="Начало фрагмента" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"></button><button class="handle" id="endHandle" role="slider" aria-label="Конец фрагмента" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"></button></div>
<div class="times"><div class="group"><label for="startText">Начало</label><input id="startText" aria-label="Начало ММ:СС" value="00:00.00"><button id="setStart" title="Установить начало по текущей позиции" aria-label="Начало по текущему кадру"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h2v16H5zm4 8 10-7v14z"/></svg></button></div><div class="group"><label for="endText">Конец</label><input id="endText" aria-label="Конец ММ:СС" value="00:01.00"><button id="setEnd" title="Установить конец по текущей позиции" aria-label="Конец по текущему кадру"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4h2v16h-2zM5 5l10 7-10 7z"/></svg></button></div></div>
</div></div><p class="help">Жёлтые края — границы обрезки. Стрелки на клавиатуре: 0,1 с; Shift + стрелки: 1 с.</p><div id="error" class="error" role="alert"></div>
<script>
const $=id=>document.getElementById(id),v=$('video'),st=$('startText'),et=$('endText'),bar=$('timeline');
let state={start:0,end:1,duration:1},source=null,lastBounds='',init=false,sequence=Date.now(),full=false,dragging=null;
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function fmt(t){const n=Math.round(Math.max(0,t||0)*100);return String(Math.floor(n/6000)).padStart(2,'0')+':'+((n%6000)/100).toFixed(2).padStart(5,'0')}
function parse(s){const a=s.trim().replace(',','.').split(':');return a.length===2&&/^\d+$/.test(a[0])&&/^\d+(\.\d+)?$/.test(a[1])&&+a[1]<60?+a[0]*60 + +a[1]:NaN}
function draw(){const a=state.start/state.duration*100,b=state.end/state.duration*100;for(const [edge,p] of [['start',a],['end',b]]){const el=$(edge+'Handle');el.style.left=p+'%';el.setAttribute('aria-valuemax',state.duration);el.setAttribute('aria-valuenow',state[edge]);el.setAttribute('aria-valuetext',fmt(state[edge]))}Object.assign($('selection').style,{left:a+'%',width:(b-a)+'%'});$('leftShade').style.width=a+'%';$('rightShade').style.width=(100-b)+'%';st.value=fmt(state.start);et.value=fmt(state.end);$('duration').textContent='Фрагмент '+fmt(state.end-state.start)}
function update(edge,value,notify=true){if(!Number.isFinite(value)){draw();return}if(edge==='start')state.start=Math.max(0,Math.min(value,state.end-.05));else state.end=Math.min(state.duration,Math.max(value,state.start+.05));state[edge]=Math.round(state[edge]*1000)/1000;v.pause();draw();v.currentTime=edge==='start'?state.start:Math.max(state.start,state.end-.25);if(notify)persist()}
function persist(){send('streamlit:setComponentValue',{value:{start:state.start,end:state.end,sequence:++sequence}})}
function play(){if(!source||v.error)return;if(!v.paused){v.pause();return}if(!full&&(v.currentTime<state.start||v.currentTime>=state.end-.02))v.currentTime=state.start;v.play().catch(()=>{$('error').textContent='Не удалось воспроизвести исходник в этом браузере.'})}
$('play').onclick=play;$('stage').onkeydown=e=>{if(e.code==='Space'&&e.target===$('stage')){e.preventDefault();play()}};
$('whole').onclick=()=>{full=!full;$('whole').setAttribute('aria-pressed',full);if(!full&&(v.currentTime<state.start||v.currentTime>state.end)){v.pause();v.currentTime=state.start}};
for(const edge of ['start','end']){const handle=$(edge+'Handle');handle.onpointerdown=e=>{e.preventDefault();dragging=edge;handle.setPointerCapture(e.pointerId);handle.focus()};handle.onpointermove=e=>{if(dragging===edge){const r=bar.getBoundingClientRect();update(edge,(e.clientX-r.left)/r.width*state.duration,false)}};handle.onpointerup=()=>{if(dragging){dragging=null;persist()}};handle.onpointercancel=()=>{dragging=null;persist()};handle.onkeydown=e=>{let t=state[edge];if(e.key==='ArrowLeft'||e.key==='ArrowDown')t-=e.shiftKey?1:.1;else if(e.key==='ArrowRight'||e.key==='ArrowUp')t+=e.shiftKey?1:.1;else if(e.key==='Home')t=0;else if(e.key==='End')t=state.duration;else return;e.preventDefault();update(edge,t)}}
bar.onclick=e=>{if(e.target.closest('.handle'))return;const r=bar.getBoundingClientRect();v.currentTime=Math.max(0,Math.min(state.duration,(e.clientX-r.left)/r.width*state.duration))};
st.onchange=()=>update('start',parse(st.value));et.onchange=()=>update('end',parse(et.value));$('setStart').onclick=()=>update('start',v.currentTime);$('setEnd').onclick=()=>update('end',v.currentTime);
v.onplay=()=>{$('playIcon').innerHTML='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';$('play').setAttribute('aria-label','Пауза')};v.onpause=()=>{$('playIcon').innerHTML='<path d="M8 5v14l11-7z"/>';$('play').setAttribute('aria-label','Воспроизвести выбранный фрагмент')};
function tick(){if(!full&&!v.paused){if(v.currentTime>=state.end){v.pause();v.currentTime=state.end}else if(v.currentTime<state.start)v.currentTime=state.start}$('playhead').style.left=(v.currentTime/state.duration*100)+'%';$('clock').textContent=fmt(v.currentTime)+' / '+fmt(state.duration);requestAnimationFrame(tick)}tick();
new IntersectionObserver(entries=>{if(!entries[0].isIntersecting)v.pause()}).observe($('stage'));document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause()});
v.onloadeddata=()=>{$('loading').hidden=true;thumbnails()};v.onerror=()=>{if(!source)return;$('loading').hidden=true;$('error').textContent='Браузер не смог показать исходник. Границы и экспорт в After Effects доступны.'};
async function thumbnails(){const canvas=$('film'),ctx=canvas.getContext('2d'),probe=document.createElement('video');probe.muted=true;probe.crossOrigin='anonymous';probe.preload='auto';const current=v.src;canvas.width=800;canvas.height=54;try{await new Promise((resolve,reject)=>{probe.onloadedmetadata=resolve;probe.onerror=reject;probe.src=current});for(let i=0;i<8;i++){await new Promise((resolve,reject)=>{probe.onseeked=resolve;probe.onerror=reject;probe.currentTime=Math.min(state.duration-.01,(i+.5)/8*state.duration)});if(v.src!==current)break;ctx.drawImage(probe,i*100,0,100,54)}}catch{}finally{probe.removeAttribute('src');probe.load()}}
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;const a=e.data.args;document.body.dataset.theme=a.app_theme||'light';state.duration=a.duration;const bounds=JSON.stringify([a.start,a.end]);if(!init||bounds!==lastBounds){state.start=a.start;state.end=a.end;init=true;lastBounds=bounds}if(source!==a.url){source=a.url;$('play').disabled=!source;$('loading').hidden=!source;$('error').textContent=source?'':'Исходник недоступен. Привяжите его в видеотеке.';if(source){v.onloadedmetadata=()=>{v.currentTime=state.start};v.src=window.parent.location.protocol+'//'+window.parent.location.hostname+source}else{v.removeAttribute('src');v.load()}}draw()});
new ResizeObserver(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+4})).observe(document.body);send('streamlit:componentReady',{apiVersion:1});
</script></html>
