<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>

.manual-actions:not([hidden]) {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin-top: 8px;
}
.manual-actions button {
    background: #1d4ed8;
    border-color: #1d4ed8;
    color: white;
    font-weight: 650;
}
.manual-actions button:hover { background: #1e40af; }
.manual-actions button:disabled { opacity: .75; cursor: wait; }
.manual-actions output { color: var(--muted); }
body[data-manual=true] .group button { white-space: nowrap; }
body:not([data-manual=true]) .mark-label,
body[data-manual=true] .group button svg { display: none; }
</style>
<div class="stage" id="stage" tabindex="0" aria-label="Редактор видео. Пробел — воспроизведение или пауза">
<video id="video" crossorigin="anonymous" preload="metadata" playsinline></video><span class="loading" id="loading" role="status">Загрузка видео…</span>
<div class="overlay">
<div class="toolbar"><button id="play" aria-label="Воспроизвести выбранный фрагмент"><svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><span class="clock" id="clock">00:00 / 00:00</span><button id="whole" aria-pressed="false" title="Смотреть полное видео без ограничения границ">Весь файл</button><span id="duration" class="duration"></span></div>
<div class="timeline" id="timeline" aria-label="Шкала полного видео"><canvas id="film"></canvas><div class="shade leftShade" id="leftShade"></div><div class="shade rightShade" id="rightShade"></div><div class="selection" id="selection"></div><div class="playhead" id="playhead"></div><button class="handle" id="startHandle" role="slider" aria-label="Начало фрагмента" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"></button><button class="handle" id="endHandle" role="slider" aria-label="Конец фрагмента" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"></button></div>
<div class="times"><div class="group"><label for="startText">Начало</label><input id="startText" aria-label="Начало ММ:СС" value="00:00.00"><button id="setStart" title="Установить начало по текущей позиции" aria-label="Начало по текущему кадру"><span class="mark-label">Начало здесь</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h2v16H5zm4 8 10-7v14z"/></svg></button></div><div class="group"><label for="endText">Конец</label><input id="endText" aria-label="Конец ММ:СС" value="00:01.00"><button id="setEnd" title="Установить конец по текущей позиции" aria-label="Конец по текущему кадру"><span class="mark-label">Конец здесь</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4h2v16h-2zM5 5l10 7-10 7z"/></svg></button></div></div>
</div></div>
<div id="manualActions" class="manual-actions" hidden>
    <button id="addClip" disabled>Добавить в монтаж</button>
    <output id="addStatus" role="status"></output>
</div>
<p class="help" id="help">Жёлтые края — границы обрезки. Стрелки на клавиатуре: 0,1 с; Shift + стрелки: 1 с.</p><div id="error" class="error" role="alert"></div>
<script>
const $=id=>document.getElementById(id),v=$('video'),st=$('startText'),et=$('endText'),bar=$('timeline');
let state={start:0,end:1,duration:1},source=null,lastBounds='',init=false,sequence=Date.now(),full=false,dragging=null;
let manual = false;
let pendingAdd = null;
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function fmt(t){const n=Math.round(Math.max(0,t||0)*100);return String(Math.floor(n/6000)).padStart(2,'0')+':'+((n%6000)/100).toFixed(2).padStart(5,'0')}
function parse(s){const a=s.trim().replace(',','.').split(':');return a.length===2&&/^\d+$/.test(a[0])&&/^\d+(\.\d+)?$/.test(a[1])&&+a[1]<60?+a[0]*60 + +a[1]:NaN}
function draw(){const a=state.start/state.duration*100,b=state.end/state.duration*100;for(const [edge,p] of [['start',a],['end',b]]){const el=$(edge+'Handle');el.style.left=p+'%';el.setAttribute('aria-valuemax',state.duration);el.setAttribute('aria-valuenow',state[edge]);el.setAttribute('aria-valuetext',fmt(state[edge]))}Object.assign($('selection').style,{left:a+'%',width:(b-a)+'%'});$('leftShade').style.width=a+'%';$('rightShade').style.width=(100-b)+'%';st.value=fmt(state.start);et.value=fmt(state.end);$('duration').textContent='Фрагмент '+fmt(state.end-state.start)}
function update(edge, value, notify = true, mark = false) {
    if (!Number.isFinite(value)) { draw(); return; }
    const gap = Math.min(.05, state.duration);
    if (manual && mark) {
        if (edge === 'start' && value >= state.end - gap) state.end = state.duration;
        if (edge === 'end' && value <= state.start + gap) state.start = 0;
    }
    const rounded = Math.round(value * 1000) / 1000;
    if (edge === 'start') state.start = Math.max(0, Math.min(rounded, state.end - gap));
    else state.end = Math.min(state.duration, Math.max(rounded, state.start + gap));
    if (!mark || !manual) {
        v.pause();
        v.currentTime = edge === 'start' ? state.start : Math.max(state.start, state.end - .25);
    }
    if (manual) $('addStatus').textContent = '';
    draw();
    if (notify && !manual) persist();
}
function persist(type = 'bounds') {
    const value = {type, start: state.start, end: state.end, sequence: ++sequence};
    if (type === 'add') {
        pendingAdd = value.sequence;
        $('addClip').disabled = true;
        $('addStatus').textContent = 'Добавляю…';
    }
    send('streamlit:setComponentValue', {value});
}
function syncPlaybackMode() {
    $('whole').setAttribute('aria-pressed', full);
    if (manual) $('whole').textContent = full ? 'Смотреть отрезок' : 'Смотреть целиком';
    if (v.paused) $('play').setAttribute('aria-label', full ? 'Воспроизвести исходник' : 'Воспроизвести выбранный фрагмент');
}
$('addClip').onclick = () => {
    if (manual && source && pendingAdd === null) persist('add');
};
function play(){if(!source||v.error)return;if(!v.paused){v.pause();return}if(!full&&(v.currentTime<state.start||v.currentTime>=state.end-.02))v.currentTime=state.start;v.play().catch(()=>{$('error').textContent='Не удалось воспроизвести исходник в этом браузере.'})}
$('play').onclick=play;$('stage').onkeydown=e=>{if(e.code==='Space'&&e.target===$('stage')){e.preventDefault();play()}};
$('whole').onclick=()=>{full=!full;syncPlaybackMode();if(!full&&(v.currentTime<state.start||v.currentTime>state.end)){v.pause();v.currentTime=state.start}};
for(const edge of ['start','end']){const handle=$(edge+'Handle');handle.onpointerdown=e=>{e.preventDefault();dragging=edge;handle.setPointerCapture(e.pointerId);handle.focus()};handle.onpointermove=e=>{if(dragging===edge){const r=bar.getBoundingClientRect();update(edge,(e.clientX-r.left)/r.width*state.duration,false)}};handle.onpointerup=()=>{if(dragging){dragging=null;if(!manual)persist()}};handle.onpointercancel=()=>{dragging=null;if(!manual)persist()};handle.onkeydown=e=>{let t=state[edge];if(e.key==='ArrowLeft'||e.key==='ArrowDown')t-=e.shiftKey?1:.1;else if(e.key==='ArrowRight'||e.key==='ArrowUp')t+=e.shiftKey?1:.1;else if(e.key==='Home')t=0;else if(e.key==='End')t=state.duration;else return;e.preventDefault();update(edge,t)}}
bar.onclick=e=>{if(e.target.closest('.handle'))return;const r=bar.getBoundingClientRect();v.currentTime=Math.max(0,Math.min(state.duration,(e.clientX-r.left)/r.width*state.duration))};
st.onchange=()=>update('start',parse(st.value));et.onchange=()=>update('end',parse(et.value));$('setStart').onclick=()=>update('start',v.currentTime,true,true);$('setEnd').onclick=()=>update('end',v.currentTime,true,true);
v.onplay=()=>{$('playIcon').innerHTML='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';$('play').setAttribute('aria-label','Пауза')};v.onpause=()=>{$('playIcon').innerHTML='<path d="M8 5v14l11-7z"/>';syncPlaybackMode()};
function tick(){if(!full&&!v.paused){if(v.currentTime>=state.end){v.pause();v.currentTime=state.end}else if(v.currentTime<state.start)v.currentTime=state.start}$('playhead').style.left=(v.currentTime/state.duration*100)+'%';$('clock').textContent=fmt(v.currentTime)+' / '+fmt(state.duration);requestAnimationFrame(tick)}tick();
new IntersectionObserver(entries=>{if(!entries[0].isIntersecting)v.pause()}).observe($('stage'));document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause()});
v.onloadeddata=()=>{$('loading').hidden=true;thumbnails()};v.onerror=()=>{if(!source)return;$('loading').hidden=true;$('error').textContent='Браузер не смог показать исходник. Границы и экспорт в After Effects доступны.'};
async function thumbnails(){const canvas=$('film'),ctx=canvas.getContext('2d'),probe=document.createElement('video');probe.muted=true;probe.crossOrigin='anonymous';probe.preload='auto';const current=v.src;canvas.width=800;canvas.height=54;try{await new Promise((resolve,reject)=>{probe.onloadedmetadata=resolve;probe.onerror=reject;probe.src=current});for(let i=0;i<8;i++){await new Promise((resolve,reject)=>{probe.onseeked=resolve;probe.onerror=reject;probe.currentTime=Math.min(state.duration-.01,(i+.5)/8*state.duration)});if(v.src!==current)break;ctx.drawImage(probe,i*100,0,100,54)}}catch{}finally{probe.removeAttribute('src');probe.load()}}
window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.type !== 'streamlit:render') return;
    const args = event.data.args;
    document.body.dataset.theme = args.app_theme || 'light';
    manual = Boolean(args.manual);
    document.body.dataset.manual = String(manual);
    $('manualActions').hidden = !manual;
    if (manual) $('help').hidden = true;
    state.duration = args.duration;
    const bounds = JSON.stringify([args.start, args.end, args.duration]);
    const sourceChanged = source !== args.url;
    if (!init || sourceChanged || (!manual && bounds !== lastBounds)) {
        state.start = args.start;
        state.end = args.end;
        lastBounds = bounds;
        if (!init || sourceChanged) {
            full = manual;
            syncPlaybackMode();
        }
        init = true;
        draw();
    }
    if (sourceChanged) {
        source = args.url;
        $('play').disabled = !source;
        $('loading').hidden = !source;
        $('error').textContent = source ? '' : 'Исходник недоступен. Привяжите его в видеотеке.';
        if (source) {
            v.onloadedmetadata = () => { v.currentTime = state.start; };
            v.src = window.parent.location.protocol + '//' + window.parent.location.hostname + source;
        } else {
            v.removeAttribute('src');
            v.load();
        }
    }
    const ack = args.ack;
    if (ack) {
        sequence = Math.max(sequence, ack.sequence);
        if (ack.sequence === pendingAdd) {
            pendingAdd = null;
            $('addStatus').textContent = ack.ok ? 'Добавлено в монтаж' : 'Проверьте границы фрагмента.';
        }
    }
    $('addClip').disabled = !source || pendingAdd !== null;
});
new ResizeObserver(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+4})).observe(document.body);send('streamlit:componentReady',{apiVersion:1});
</script></html>
