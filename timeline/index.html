<div class="bar"><span class="heading" id="heading">Монтаж</span><span class="speaker" id="speaker"></span><span class="clock" id="clock">00:00 / 00:00</span><span class="status" id="status"></span><button class="view-toggle" id="compact" aria-pressed="false">Компактный вид</button></div>

const $=id=>document.getElementById(id),v=$('video'),tracks=$('tracks');

let drag=null, pending=null;
const minLength=.001;
const view={compact:false, fullLeft:0, compactLeft:0};
const viewKey='montage-view';

const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');

const url=s=>window.parent.location.protocol+'//'+window.parent.location.hostname+s;

const signature=items=>JSON.stringify(items.map(c=>[c.id,c.start,c.end,c.url,c.label,c.source_duration]));

function paint(){tracks.querySelectorAll('.clip').forEach((el,i)=>el.classList.toggle('active',i===index));$('speaker').textContent=clips[index]?.label||''}

function setIndex(i,time=0,play=false){

function playError(error){

function advance(){

function checkBoundary(){

$('play').onclick=toggle;

v.onended=advance;
v.ontimeupdate=checkBoundary;
v.onerror=()=>{
    if(!clips.length||!clips[index].url)return;

function move(id,to){

    const active=clips[index];
    const [item]=clips.splice(from,1);
    clips.splice(to,0,item);
    index=clips.indexOf(active);
    render();
    post({type:'order',order:clips.map(c=>c.id)});
}
function remove(id){
    const old=clips.findIndex(c=>c.id===id);

    const active=clips[index];

    if(active?.id===id){

        if(clips.length)setIndex(index);
        else{wantedPlay=false;v.removeAttribute('src');v.load()}

function showSource(c,at){sourceMode=true;v.pause();seekSource(c,at,false)}

        preview();

        if(changed)finishTrim(c);
    };

        if(!trim)return;
        c.start=trim.start;
        c.end=trim.end;
        c.duration=c.end-c.start;
        trim=null;
        drawTime();
        block.classList.remove('trimming');
        preview();
    };

}
function updateDrag(elapsed){
    const {x,y,from}=drag;
    const box=tracks.getBoundingClientRect();
    drag.target?.removeAttribute('data-drop');
    drag.target=null;
    drag.to=from;
    if(y<box.top||y>box.bottom||x<box.left-32||x>box.right+32)return;

        const rect=el.getBoundingClientRect();

    });

    drag.block.classList.remove('dragging');

    drag=null;
}

    });

    tracks.scrollLeft=left;
    saveView();
    paint();
    const restored=Array.from(tracks.children).find(el=>el.dataset.id===focusId);
    const control=focusControl&&restored?.querySelector(focusControl);

}
$('compact').onclick=()=>{
    if(drag||trim)return;
    saveView();
    view.compact=!view.compact;
    render(view[scrollKey()]);
};
$('seek').oninput=()=>{const t=+$('seek').value;let i=0;while(i<clips.length-1&&offset(i+1)<=t)i++;setIndex(i,Math.max(0,t-offset(i)),wantedPlay)};
let previousFrame=performance.now();

requestAnimationFrame(tick);
let loaded=false;

window.addEventListener('resize',()=>{if(loaded&&!trim&&!drag)render()});
