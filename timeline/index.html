<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#fff;--surface:#f1f4f8;--text:#17212f;--muted:#48586d;--line:#6b7b90;--accent:#1d4ed8;--trim:#f6c84a;--on-trim:#211900}body[data-theme=dark]{--bg:#1b222e;--surface:#242f3e;--text:#edf2fa;--muted:#becbde;--line:#8797ad;--accent:#9abfff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{display:flex;gap:12px;align-items:center;min-height:40px;margin-bottom:6px}.heading{font-weight:700}.clock{font-variant-numeric:tabular-nums;color:var(--muted)}.speaker{font-weight:650;overflow-wrap:anywhere}.status{color:var(--muted);font-size:12px;margin-left:auto}.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px}.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}video{width:100%;height:144px;display:block;object-fit:contain;background:var(--surface)}.player-buttons{position:absolute;bottom:6px;left:6px;display:flex;gap:6px}button{font:inherit;min-width:36px;min-height:36px;border:1px solid var(--line);color:var(--text);background:var(--bg);border-radius:7px;cursor:pointer;padding:5px 8px}button:hover{background:var(--surface)}button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}svg{width:18px;height:18px;fill:currentColor;vertical-align:middle}.edit-area{min-width:0}.tracks{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 10px;min-height:106px;align-items:stretch;scrollbar-width:thin}.clip{position:relative;flex-shrink:0;min-width:140px;width:180px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:grab;touch-action:pan-y;overflow:visible}.clip.active{box-shadow:inset 0 0 0 2px var(--accent)}.clip.dragging{opacity:.55}.clip.drop-target{outline:3px dashed var(--accent);outline-offset:-3px}.content{padding:6px 16px 6px;min-height:90px;user-select:none}.name{display:block;font-weight:650;white </style>
<div class="bar"><span class="heading" id="heading">Монтаж</span><span class="speaker" id="speaker"></span><span class="clock" id="clock">00:00 / 00:00</span><span class="status" id="status"></span></div>
<div class="workspace"><div class="stage"><video id="video" crossorigin="anonymous" preload="metadata" playsinline></video><div class="player-buttons"><button id="play" aria-label="Воспроизвести монтаж"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button></div></div><div class="edit-area"><div id="tracks" class="tracks" aria-label="Порядок и границы фрагментов монтажа"></div><input id="seek" class="seek" type="range" min="0" max="1" step="0.05" value="0" aria-label="Позиция в общем ролике"><div class="hint">Жёлтые края — обрезка · × — убрать из монтажа</div></div></div><div id="error" class="error" role="alert"></div>
<script>
const $=id=>document.getElementById(id),v=$('video'),tracks=$('tracks');
let clips=[],index=0,signature='',sequence=Date.now(),wantedPlay=false,trim=null,sourceMode=false,sourceSeek=0;
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const icon=path=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+path+'"/></svg>';
function fmt(t){const n=Math.round(Math.max(0,t||0)*100);return String(Math.floor(n/6000)).padStart(2,'0')+':'+((n%6000)/100).toFixed(2).padStart(5,'0')}
const url=s=>window.parent.location.protocol+'//'+window.parent.location.hostname+s;
function offset(i){return clips.slice(0,i).reduce((s,c)=>s+c.duration,0)}
function total(){return offset(clips.length)}
function post(payload){send('streamlit:setComponentValue',{value:{...payload,sequence:++sequence}})}
function paint(){tracks.querySelectorAll('.clip').forEach((el,i)=>el.classList.toggle('active',i===index));$('speaker').textContent=clips[index]?.label||''}
function seekSource(c,at,play){
    sourceSeek=at;
    wantedPlay=play;
    $('error').textContent='';
    if(!c.url){
        wantedPlay=false;v.pause();v.removeAttribute('src');v.load();
        $('error').textContent='Исходник недоступен. Привяжите его в видеотеке.';
        return;
    }
    const src=url(c.url);
    if(v.src!==src){v.src=src;return}
    if(v.readyState>=1)applySeek();

function applySeek(){
    v.currentTime=Math.min(sourceSeek,v.duration);
    if(wantedPlay)v.play().catch(playError);
}
v.onloadedmetadata=applySeek;
function setIndex(i,time=0,play=false){
    if(!clips.length)return;
    index=Math.max(0,Math.min(clips.length-1,i));
    sourceMode=false;
    const clip=clips[index];
    seekSource(clip,clip.start+Math.min(clip.duration,time),play);
    paint();
}
function playError(error){
    if(error?.name==='AbortError')return;
    wantedPlay=false;
    if(!v.error)$('error').textContent='Нажмите воспроизведение ещё раз.';
}
function toggle(){
    if(!clips.length||!clips[index].url)return;
    if(!v.paused||wantedPlay){v.pause();wantedPlay=false;return}
    if(sourceMode){setIndex(index,0,true);return}
    if(v.currentTime>=clips[index].end-.001){setIndex(index+1<clips.length?index+1:0,0,true);return}
    wantedPlay=true;
    if(v.readyState>=1)v.play().catch(playError);
}
function advance(){
    if(!clips.length||!wantedPlay||sourceMode||trim)return;
    if(index<clips.length-1)setIndex(index+1,0,true);
    else{wantedPlay=false;v.pause();v.currentTime=Math.min(v.duration,clips[index].end)}
}
function checkBoundary(){
    if(wantedPlay&&!v.paused&&!v.seeking&&clips[index]&&v.currentTime>=clips[index].end)advance();
}
$('play').onclick=toggle;
v.onplay=()=>{$('error').textContent='';$('play').innerHTML=icon('M6 5h4v14H6zm8 0h4v14h-4z');$('play').setAttribute('aria-label','Пауза')};
v.onpause=()=>{$('play').innerHTML=icon('M8 5v14l11-7z');$('play').setAttribute('aria-label','Воспроизвести монтаж')};
v.onended=advance;
v.ontimeupdate=checkBoundary;
v.onerror=()=>{
    if(!clips.length||!clips[index].url)return;
    wantedPlay=false;
    $('error').textContent='Браузер не смог показать исходник. Границы и экспорт в After Effects доступны.';
};
function move(id,to){const from=clips.findIndex(c=>c.id===id);if(from<0||to<0||to>=clips.length||from===to)return;v.pause();const [item]=clips.splice(from,1);clips.splice(to,0,item);signature='';index=to;render();setIndex(to);post({type:'order',order:clips.map(c=>c.id)})}
function remove(id){const old=clips.findIndex(c=>c.id===id);if(old<0)return;v.pause();wantedPlay=false;clips.splice(old,1);signature='';index=Math.max(0,Math.min(old,clips.length-1));render();if(clips.length)setIndex(index);else{v.removeAttribute('src');v.load()}post({type:'remove',id})}
function showSource(c,at){sourceMode=true;v.pause();seekSource(c,at,false)}
function changeBounds(c,edge,value){if(edge==='start')c.start=Math.max(0,Math.min(value,c.end-.05));else c.end=Math.min(c.source_duration,Math.max(value,c.start+.05));c.start=Math.round(c.start*1000)/1000;c.end=Math.round(c.end*1000)/1000;c.duration=c.end-c.start}
function finishTrim(c){v.pause();wantedPlay=false;signature='';render();post({type:'trim',id:c.id,start:c.start,end:c.end})}
function buildEdge(c,edge,block,detail){const h=document.createElement('button');h.className='edge '+edge;h.setAttribute('role','slider');h.setAttribute('aria-label',(edge==='start'?'Начало':'Конец')+' фрагмента '+(clips.indexOf(c)+1)+': '+c.label);h.setAttribute('aria-valuemin','0');h.setAttribute('aria-valuemax',c.source_duration);h.setAttribute('aria-valuenow',c[edge]);h.setAttribute('aria-valuetext',fmt(c[edge]));h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();index=clips.indexOf(c);wantedPlay=false;v.pause();paint();h.focus();h.setPointerCapture(e.pointerId);trim={x:e.clientX,start:c.start,end:c.end,scale:Math.max(.005,c.duration/block.getBoundingClientRect().width),edge};block.classList.add('trimming')};h.onpointermove=e=>{if(!trim||trim.edge!==edge)return;e.preventDefault();const value=(edge==='start'?trim.start:trim.end)+(e.clientX-trim.x)*trim.scale;changeBounds(c,edge,value);h.setAttribute('aria-valuenow',c[edge]);h.setAttribute('aria-valuetext',fmt(c[edge]));detail.textContent=fmt(c.start)+' — '+fmt(c.end);let badge=block.querySelector('.trim-value');if(!badge){badge=document.createElement('span');badge.className='trim-value';block.append(badge)}badge.textContent=(edge==='start'?'Начало ':'Конец ')+fmt(c[edge]);showSource(c,edge==='start'?c.start:Math.max(c.start,c.end-.08))};h.onpointerup=e=>{e.stopPropagation();if(!trim)return;trim=null;block.classList.remove('trimming');finishTrim(c)};h.onpointercancel=()=>{if(trim){c.start=trim.start;c.end=trim.end;c.duration=c.end-c.start}trim=null;block.classList.remove('trimming');render();setIndex(index)};h.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.key))return;e.preventDefault();const delta=['ArrowLeft','ArrowDown'].includes(e.key)?-1:1;changeBounds(c,edge,c[edge]+delta*(e.shiftKey?1:.1));finishTrim(c)};return h}
function render(){const focused=document.activeElement,focusId=focused?.closest('.clip')?.dataset.id,focusEdge=focused?.classList.contains('edge')?(focused.classList.contains('start')?'start':'end'):null;tracks.replaceChildren();$('heading').textContent='Монтаж · '+clips.length;$('seek').max=Math.max(total(),.01);$('status').textContent='Превью исходников';clips.forEach((c,i)=>{const block=document.createElement('div');block.className='clip';block.dataset.id=c.id;block.style.width=Math.max(150,Math.min(Math.min(360,Math.max(150,tracks.clientWidth-8)),c.duration/Math.max(total(),.001)*Math.max(600,clips.length*170)))+'px';block.tabIndex=0;block.setAttribute('role','button');block.setAttribute('aria-label','Фрагмент '+(i+1)+': '+c.label);block.title=c.label;const content=document.createElement('div');content.className='content';const name=document.createElement('span');name.className='name';name.textContent=c.label;name.title=c.label;const detail=document.createElement('span');detail.className='detail';detail.textContent=fmt(c.start)+' — '+fmt(c.end);content.append(name);const duration=document.createElement('span');duration.className='detail';duration.textContent='Длина: '+fmt(c.duration);content.append(detail,duration);const del=document.createElement('button');del.className='remove';del.innerHTML=icon('M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z');del.setAttribute('aria-label','Убрать из монтажа: '+c.label);del.onclick=e=>{e.stopPropagation();remove(c.id)};let origin=null,destination=i,moved=false;content.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();origin=[e.clientX,e.clientY];destination=i;moved=false;content.setPointerCapture(e.pointerId)};content.onpointermove=e=>{if(!origin||Math.hypot(e.clientX-origin[0],e.clientY-origin[1])<6)return;moved=true;block.classList.add('dragging');tracks.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.clip');if(target){destination=clips.findIndex(x=>x.id===target.dataset.id);target.classList.add('drop-target')}};content.onpointerup=()=>{if(!origin)return;origin=null;block.classList.remove('dragging');tracks.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(moved)move(c.id,destination);else setIndex(clips.indexOf(c),0,true)};content.onpointercancel=()=>{origin=null;block.classList.remove('dragging')};block.onkeydown=e=>{if(e.target!==block)return;if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();remove(c.id)}else if(e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();move(c.id,i+(e.key==='ArrowLeft'?-1:1))}else if(e.key==='Enter'||e.code==='Space'){e.preventDefault();setIndex(i,0,true)}};block.append(content,del,buildEdge(c,'start',block,detail),buildEdge(c,'end',block,detail));tracks.append(block)});paint();if(focusId&&focusEdge){tracks.querySelector('[data-id="'+focusId+'"] .edge.'+focusEdge)?.focus({preventScroll:true})}if(!clips.length)$('clock').textContent='00:00 / 00:00'}
$('seek').oninput=()=>{const t=+$('seek').value;let i=0;while(i<clips.length-1&&offset(i+1)<=t)i++;setIndex(i,Math.max(0,t-offset(i)),wantedPlay)};
function tick(){
    checkBoundary();
    if(clips.length&&!sourceMode&&!trim){
        const c=clips[index],at=v.seeking||v.readyState<1?sourceSeek:v.currentTime;
        const t=offset(index)+Math.min(c.duration,Math.max(0,at-c.start));
        $('clock').textContent=fmt(t)+' / '+fmt(total());
        if(document.activeElement!==$('seek'))$('seek').value=t;
    }
    requestAnimationFrame(tick);
}
tick();
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;const a=e.data.args;document.body.dataset.theme=a.app_theme||'light';const incoming=a.clips||[],sig=JSON.stringify(incoming.map(c=>[c.id,c.start,c.end,c.url,c.label,c.source_duration]));if(sig!==signature){const active=clips[index]?.id;signature=sig;v.pause();clips=incoming;index=Math.max(0,clips.findIndex(c=>c.id===active));render();setIndex(index)}});
window.addEventListener('resize',()=>{if(!trim)render()});
new ResizeObserver(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+4})).observe(document.body);
try{const pd=window.parent.document,dock=pd.querySelector('.st-key-montage-dock');if(dock){const obs=new ResizeObserver(()=>pd.documentElement.style.setProperty('--vw-dock-height',Math.ceil(dock.getBoundingClientRect().height)+'px'));obs.observe(dock);const focus=e=>{if(dock.contains(e.target)||e.target.closest('[data-testid=stPopoverBody],[role=dialog]'))return;const r=e.target.getBoundingClientRect(),top=dock.getBoundingClientRect().top;if(r.bottom>top)e.target.scrollIntoView({block:'center'})};pd.addEventListener('focusin',focus);window.addEventListener('pagehide',()=>{obs.disconnect();pd.removeEventListener('focusin',focus)})}}catch{}
send('streamlit:componentReady',{apiVersion:1});
</script></html>
